{% set name = "trame-server" %}
{% set version = "3.14.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ca4d8f6ba7e46b81bfe9e3f7eb83de3df9d35abb0f0921ba0cf00286a26756ea

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - wslink >=2.5.7,<3
    - trame-common >=1.2.3
    - more-itertools

# PyPi package has no tests included, use only `pip check`
test:
  imports:
    - trame_server
    - trame_server.utils
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Kitware/trame-server
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Internal server side implementation of trame
  description: |
    trame-server is the server implementation of trame.
    This Python library provide the server implementation of the shared state and controller
    along with the definition of the web server.
    The web server aims to be flexible so it can be use within a Jupyter environment or as a standalone desktop application.
  doc_url: https://github.com/Kitware/trame-server/blob/v3.12.2/README.rst
  dev_url: https://github.com/Kitware/trame-server

extra:
  recipe-maintainers:
    - larsoner
    - jourdain
    - psavery
    - kwrobot
